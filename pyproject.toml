[project]
name = "neo4j-build-sprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "neo4j>=5.20.0",
    "neo4j-graphrag>=1.0.0",
    "google-adk>=0.5.0",
    "google-genai>=1.0.0",
    "neo4j-agent-memory[google-adk]>=0.1.0",
    "streamlit>=1.35.0",
]

[project.scripts]
neo4j-build-sprint = "neo4j_build_sprint:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
